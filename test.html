<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            line-height: 1.6;
        }
        
        .sentence-display {
            font-size: 1.5em;
            margin-bottom: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
        }
        
        .word {
            padding: 2px 4px;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .correct {
            background-color: #90EE90;
            color: #006400;
        }
        
        .incorrect {
            background-color: #FFB6C1;
            color: #8B0000;
            text-decoration: line-through;
        }
        
        .pending {
            color: #666;
        }
        
        #userInput {
            width: 100%;
            padding: 12px;
            font-size: 1.2em;
            border: 2px solid #ddd;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        #userInput:focus {
            border-color: #4CAF50;
            outline: none;
        }
        
        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        
        .success {
            background-color: #90EE90;
            color: #006400;
        }
    </style>
</head>
<body>
    <h1>Translation Practice</h1>
    
    <div class="sentence-display" id="targetDisplay">
        <!-- Target sentence will be displayed here with colored words -->
    </div>
    
    <input type="text" id="userInput" placeholder="Type the English translation here...">
    
    <div class="feedback" id="feedback" style="display: none;"></div>

    <script>
        // Original Spanish sentence and target English translation
        const spanishSentence = "John come manzanas, pero no come bananas.";
        const englishSentence = "John eats apples, but does not eat bananas.";

        // Normalize contractions and common variations
        function normalizeText(text) {
            return text
                .toLowerCase()
                .replace(/\bdoesn't\b/g, 'does not')
                .replace(/\bdon't\b/g, 'do not')
                .replace(/\bwon't\b/g, 'will not')
                .replace(/\bcan't\b/g, 'cannot')
                .replace(/\bhaven't\b/g, 'have not')
                .replace(/\bhasn't\b/g, 'has not')
                .replace(/\bhadn't\b/g, 'had not')
                .replace(/\bwouldn't\b/g, 'would not')
                .replace(/\bcouldn't\b/g, 'could not')
                .replace(/\bshouldn't\b/g, 'should not')
                .replace(/\bisn't\b/g, 'is not')
                .replace(/\baren't\b/g, 'are not')
                .replace(/\bwasn't\b/g, 'was not')
                .replace(/\bweren't\b/g, 'were not')
                .replace(/'ll\b/g, ' will')
                .replace(/'re\b/g, ' are')
                .replace(/'ve\b/g, ' have')
                .replace(/'m\b/g, ' am')
                .replace(/'d\b/g, ' would')
                .replace(/[.,?!;:]$/g, '') // Remove trailing punctuation for comparison
                .trim();
        }

        // Split sentences into words (keeping punctuation for display)
        const targetWords = englishSentence.split(/\s+/);
        const normalizedTargetWords = targetWords.map(word => normalizeText(word));

        // Display the target sentence with colored spans
        function initializeDisplay() {
            const displayElement = document.getElementById('targetDisplay');
            displayElement.innerHTML = '';
            
            targetWords.forEach((word, index) => {
                const span = document.createElement('span');
                span.className = 'word pending';
                span.textContent = word +' ';
                // span.textContent = word + (index < targetWords.length - 1 ? ' ' : '');
                span.id = `word-${index}`;
                displayElement.appendChild(span);
            });
        }

        // Check user input against target
        function checkTranslation() {
            const userInput = document.getElementById('userInput').value;
            const normalizedInput = normalizeText(userInput);
            const userWords = normalizedInput.split(/\s+/).filter(word => word.length > 0);
            
            let allCorrect = true;
            let feedbackMessage = '';
            
            // Check each word
            normalizedTargetWords.forEach((targetWord, index) => {
                const wordElement = document.getElementById(`word-${index}`);
                
                if (index < userWords.length) {
                    if (userWords[index] === targetWord) {
                        wordElement.className = 'word correct';
                    } else {
                        wordElement.className = 'word incorrect';
                        allCorrect = false;
                        
                        // Show what they typed vs what's expected
                        const userTyped = userWords[index];
                        const expected = targetWords[index];
                        if (userTyped && userTyped !== targetWord) {
                            feedbackMessage += `Word ${index + 1}: Expected "${expected}" but got "${userTyped}"<br>`;
                        }
                    }
                } else {
                    wordElement.className = 'word pending';
                    allCorrect = false;
                }
            });
            
            // Handle extra words typed by user
            if (userWords.length > normalizedTargetWords.length) {
                allCorrect = false;
                feedbackMessage += `You typed ${userWords.length - normalizedTargetWords.length} extra word(s)<br>`;
            }
            
            // Show feedback
            const feedbackElement = document.getElementById('feedback');
            if (allCorrect && userWords.length === normalizedTargetWords.length) {
                feedbackElement.className = 'feedback success';
                feedbackElement.innerHTML = '🎉 Perfect! All words are correct!';
                feedbackElement.style.display = 'block';
            } else if (feedbackMessage) {
                feedbackElement.className = 'feedback';
                feedbackElement.innerHTML = feedbackMessage;
                feedbackElement.style.display = 'block';
            } else {
                feedbackElement.style.display = 'none';
            }
        }

        // Initialize the display and set up event listener
        document.addEventListener('DOMContentLoaded', function() {
            initializeDisplay();
            
            const inputElement = document.getElementById('userInput');
            inputElement.addEventListener('input', checkTranslation);
            
            // Focus the input field
            inputElement.focus();
        });
    </script>
</body>
</html>
